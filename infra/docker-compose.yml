name: food-delivery

x-app: &app
  profiles: [apps]
  restart: unless-stopped
  env_file: apps.env
  volumes:
    - ./keys:/repo/infra/keys:ro

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5544:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8088:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: food-delivery
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083

  debezium:
    image: quay.io/debezium/connect:3.0
    ports: ["8083:8083"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 40

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Local dev only: keep working when the Docker disk is nearly full.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 40

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  # Optional: `docker compose --profile apps up --build` runs the services in containers.
  # Host ports are not published for internal services except the gateways and web.
  api-gateway:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: api-gateway } }
    ports: ["4400:4400"]
  ws-gateway-1:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: ws-gateway } }
    ports: ["3010:3010"]
    environment: { PORT: "3010" }
  ws-gateway-2:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: ws-gateway } }
    ports: ["3011:3011"]
    environment: { PORT: "3011" }
  auth:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: auth } }
    environment: { DATABASE_URL: "postgresql://auth_user:auth_pass@postgres:5432/auth?schema=public" }
  restaurant:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: restaurant } }
    environment: { DATABASE_URL: "postgresql://restaurants_user:restaurants_pass@postgres:5432/restaurants?schema=public" }
  order:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: order } }
    environment: { DATABASE_URL: "postgresql://orders_user:orders_pass@postgres:5432/orders?schema=public" }
  payment:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: payment } }
    environment: { DATABASE_URL: "postgresql://payments_user:payments_pass@postgres:5432/payments?schema=public" }
  delivery:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: delivery } }
  notification:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: notification } }
  search-indexer:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: search-indexer } }
  analytics:
    <<: *app
    build: { context: .., dockerfile: infra/app.Dockerfile, args: { APP: analytics } }

volumes:
  pgdata:
  kafkadata:
  esdata:
  chdata:
